  /shipment/delivery/v4/timeframe/multipleservices:
    post:
      summary: Get available delivery dates and time windows for multiple services
      description: This API can be used to determine the delivery date and time window of multiple services.
      operationId: GetDeliveryDateWithMultipleServices
      requestBody:
        x-name: request
        required: true
        x-position: 1
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicesDeliveryDateRequest'
            examples:
              Example 1:
                value:
                  handoverDate: '2026-06-15'
                  receiverAddress:
                    countryIso: BE
                    postalCode: '8000'
                    street: Langerei
                    city: Brugge
                  services:
                  - daytime
                  - evening
                  shipmentType: parcel
                  numberOfDays: 1
                  customerCode: ABC
                  customerNumber: '123'
              Example 2:
                value:
                  handoverDate: '2026-06-15'
                  receiverAddress:
                    countryIso: NL
                    postalCode: 2521CA
                    street: null
                    city: null
                  services:
                  - daytime
                  - evening
                  shipmentType: parcel
                  numberOfDays: 1
                  customerCode: ABC
                  customerNumber: '123'
      responses:
        '200':
          description: Successful retrieval of available delivery dates and time windows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesDeliveryDateResponse'
              example:
                deliveryDates:
                - services:
                  - service: daytime
                    timeFrame:
                      from: 08:30:00
                      until: '21:30:00'
                    sustainability:
                      code: '01'
                      description: Sustainable delivery
                    shipmentType: parcel
                    availability: true
                    reason: null
                  - service: evening
                    timeFrame: null
                    sustainability: null
                    shipmentType: parcel
                    availability: false
                    reason: This postal code is not within the service area for the requested product
                  deliveryDate: '2025-12-31'
        '400':
