openapi: 3.2.0
info:
  title: Postnl Shipment API
  version: v4
  description: 'Operations tagged Shipment across 7 of this provider''s published API definitions: postnl-barcode-v4-openapi.json, postnl-confirm-v4-openapi.json, postnl-labelling-v4-openapi.json, postnl-locations-v4-openapi.json, postnl-return-v4-openapi.json, postnl-shipment-v4-openapi.json, postnl-timeframe-v4-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-sandbox.postnl.nl
  description: Non-Production server
- url: https://api.postnl.nl
  description: Production server
security:
- apikey: []
tags:
- name: Shipment
paths:
  /shipment/delivery/v4/barcode:
    post:
      description: Generates a 3S barcode for domestic and European flows. Optional fields allow specifying the barcode type, a numeric range, and the number of barcodes to return.
      operationId: CreateBarcodes
      requestBody:
        description: The payload providing customer details and specifications on the barcode(s) to generate.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBarcodesRequest'
            example:
              summary: Minimal request with required fields only
              value:
                customerNumber: '11223344'
                customerCode: DEVC
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBarcodesResponse'
        '400':
          description: One or more business errors occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Invalid apikey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      tags:
      - Shipment
      summary: Create barcodes
      x-summary-source: derived
    servers:
    - url: https://api-sandbox.postnl.nl
      description: Non-Production server
    - url: https://api.postnl.nl
      description: Production server
  /shipment/delivery/v4/confirm:
    post:
      description: Preannounce a shipment with the provided details, it will return generated barcodes if not provided
      operationId: ConfirmShipment
      requestBody:
        description: The details of the shipment to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmShipmentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmShipmentResponse'
        '400':
          description: One or more business errors occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse_2'
        '401':
          description: Invalid apikey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      tags:
      - Shipment
      summary: Confirm shipment
      x-summary-source: derived
    servers:
    - url: https://api-sandbox.postnl.nl
      description: Non-Production server
    - url: https://api.postnl.nl
      description: Production server
  /shipment/delivery/v4/label:
    post:
      description: The PostNL Labelling API is a RESTful API that creates shipping labels for outbound shipments.
      operationId: CreateLabel
      requestBody:
        description: The details of the shipment to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '400':
          description: One or more business errors occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse_3'
        '401':
          description: Invalid apikey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      tags:
      - Shipment
      summary: Create label
      x-summary-source: derived
    servers:
    - url: https://api-sandbox.postnl.nl
      description: Non-Production server
    - url: https://api.postnl.nl
      description: Production server
  /shipment/delivery/v4/locations/near-coordinates:
    post:
      summary: Get available locations
      description: This API can be used to search for locations around a given area by coordinates
      operationId: GetPickupLocationsByCoordinates
      requestBody:
        x-name: request
        required: true
        x-position: 1
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupNearCoordinatesRequest'
            example:
              numberOfLocations: 2
              coordinates:
                latitude: 52.370216
                longitude: 4.895168
              locationType: Retail
              pickupDate: '2026-06-15'
              receiverCountryIso: BE
              customerCode: ABC
              customerNumber: '123'
      responses:
        '200':
          description: Successful retrieval of pickup locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupLocationResponse'
              example:
                locations:
                - pickupLocationId: '123456789'
                  locationType: ParcelLocker
                  name: PostNL Pickup Point
                  address:
                    countryIso: NL
                    postalCode: 1234AB
                    houseNumber: '123'
                    houseNumberAddition: A
                    street: Main Street
                    city: Amsterdam
                  coordinates:
                    latitude: 52.3676
                    longitude: 4.9041
                  distance: 20
                  openingTimes:
                  - day: Monday
                    times:
                    - from: 08:00:00
                      until: '20:00:00'
                  sustainability:
                    code: '01'
                    description: Sustainable delivery
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                detail: See the errors property for more details.
                errors:
                  countryIso:
                  - The countryIso field is required.
                  address:
                  - The address field is required.
        '401':
          description: Invalid apikey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.6.1
                title: Business error occurred.
                status: 404
                detail: See the errors property for more details.
                errors:
                  request:
                  - No locations found for payload
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.6.1
                title: Unknown error occurred.
                status: 500
                errors:
                  request:
                  - Error message.
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout
      tags:
      - Shipment
    servers:
    - url: https://api-sandbox.postnl.nl
      description: Non-Production server
    - url: https://api.postnl.nl
      description: Production server
  /shipment/delivery/v4/locations/lookup:
    post:
      summary: Get location status and details
      description: This API can be used to retrieve the details and status of a specific location on a specific date
      operationId: GetPickupLocationLookup
      requestBody:
        x-name: request
        required: true
        x-position: 1
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupLocationLookupRequest'
            example:
              pickupLocationId: '123456'
              countryIso: NL
              pickupDate: '2026-06-15'
              customerCode: PLI
              customerNumber: '12345'
      responses:
        '200':
          description: Successful retrieval of location details and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupLocationLookupResponse'
              example:
                location:
                  pickupLocationId: '163272'
                  pickupLocationAvailable: false
                  locationType: Retail
                  name: Kantoorboekhandel van Remortel Sluis
                  address:
                    countryIso: NL
                    postalCode: 4524EC
                    houseNumber: '25'
                    houseNumberAddition: A
                    street: Nieuwstraat
                    city: Sluis
                  coordinates:
                    latitude: 52.3676
                    longitude: 4.9041
                  openingTimes:
                  - day: Monday
                    times:
                    - from: 08:00:00
                      until: '20:00:00'
                  - day: Tuesday
                    times:
                    - from: 08:00:00
                      until: '20:00:00'
                  - day: Wednesday
                    times:
                    - from: 08:00:00
                      until: '20:00:00'
                  sustainability:
                    code: '02'
                    description: Sustainable option
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                detail: See the errors property for more details.
                errors:
                  countryIso:
                  - The countryIso field is required.
        '401':
          description: Invalid apikey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.6.1
                title: Business error occurred.
                status: 404
                detail: See the errors property for more details.
                errors:
                  request:
                  - Location does not exist or has been permanently closed
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
